name: PR Check

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Only the modules used by ai-router (and their -am deps) are in the default
      # reactor; the rest live in the opt-in `upstream-unmigrated-modules` profile
      # and are not migrated to Spring Boot 4 / Jackson 3.
      - name: Run tests
        run: |
          ./mvnw --batch-mode -pl ':spring-ai-retry,:spring-ai-openai,:spring-ai-ollama,:spring-ai-anthropic,:spring-ai-google-gemini,:spring-ai-deepseek,:spring-ai-mistral-ai,:spring-ai-model,:spring-ai-commons,:spring-ai-template-st' -am test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
